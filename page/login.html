<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="../assets/css/header.css">
    <link rel="stylesheet" href="../assets/css/Login.css">
</head>
<body>
<div id="home-page">
    <div id="page-header">
        <div class="header-message">
            <div class="message"></div>
            <div class="messageBorder"></div>
        </div>
        <div class="container">
            <div class="header-title">
                <a href="" class="logo">
                    <img src="/assets/img/logo/logoChinh.png" alt="Sách thiếu nhi cho bé">
                </a>
            </div>
            <div class="header-menu">
                <div class="button trangChu">
                    <a href="" class="bt"><i class="fa-solid fa-house"></i><span>Trang chủ</span></a>
                </div>
                <div class="button category">
                    <a href="" class="bt danhmuc">
                        <i class="fa-solid fa-list"></i><span>Danh mục</span></a>
                    <div class="danhMuc sach">
                        <div class="item truyenTranh"><a href="" class="it truyen-tranh"><span>Truyện tranh</span></a>
                        </div>
                        <div class="item anh"><a href="" class="it sach-anh"><span>Sách ảnh</span></a></div>
                        <div class="item giaoDuc"><a href="" class="it giao-duc"><span>Giáo dục</span></a></div>
                        <div class="item toMau"><a href="" class="it to-mau"><span>Sách tô màu</span></a></div>
                    </div>
                </div>
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" placeholder="Tìm kiếm sách">
                    <button>Tìm Kiếm</button>
                </div>
                <div class="button user">
                    <a href="" class="bt taikhoan">
                        <i class="fa-solid fa-user"></i>
                        <span>Tài khoản</span>
                    </a>
                </div>
                <div class="button shoppingCart">
                    <a href="" class="bt gio">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Giỏ hàng</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
<div id="content">
    <div class="container">
        <div class="login">
            <div class="title">Đăng nhập</div>
            <div class="inputIfor">
                <input type="text" placeholder="tên đăng nhập hoặc email">
                <div class="errorUser"></div>
                <input type="text" placeholder="mật khẩu">
                <div class="errorPass"></div>
            </div>
            <div class="forget"><span>quên mật khẩu</span></div>
            <div class="buttonLoginAndSignUp">
                <div class="button-Log"> <button>Đăng nhập</button></div>
                <div class="signUp"><span>Đăng kí</span></div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
