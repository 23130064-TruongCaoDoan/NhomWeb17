<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/home.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Cormorant+Garamond:ital,wght@0,300..700;1,300..700&family=Libre+Franklin:ital,wght@0,100..900;1,100..900&family=Merriweather+Sans:ital,wght@0,300..800;1,300..800&family=Playwrite+DE+SAS:wght@100..400&family=Sarabun:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800&display=swap"
          rel="stylesheet">
</head>
<body>
<div id="home-page">
    <div id="page-header">
        <div class="header-message">
            <div class="message"></div>
            <div class="messageBorder"></div>
        </div>
        <div class="container">
            <div class="header-title">
                <a href="" class="logo">
                    <img src="/assets/img/logo/logoChinh.png" alt="Sách thiếu nhi cho bé">
                </a>
            </div>
            <div class="header-menu">
                <div class="button trangChu">
                    <a href="" class="bt"><i class="fa-solid fa-house"></i><span>Trang chủ</span></a>
                </div>
                <div class="button category">
                    <a href="" class="bt danhmuc">
                        <i class="fa-solid fa-list"></i><span>Danh mục</span></a>
                    <div class="danhMuc sach">
                        <div class="item truyenTranh"><a href="" class="it truyen-tranh"><span>Truyện tranh</span></a>
                        </div>
                        <div class="item anh"><a href="" class="it sach-anh"><span>Sách ảnh</span></a></div>
                        <div class="item giaoDuc"><a href="" class="it giao-duc"><span>Giáo dục</span></a></div>
                        <div class="item toMau"><a href="" class="it to-mau"><span>Sách tô màu</span></a></div>
                    </div>
                </div>
                <div class="search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" placeholder="Tìm kiếm sách">
                    <button>Tìm Kiếm</button>
                </div>
                <div class="button user">
                    <a href="" class="bt taikhoan">
                        <i class="fa-solid fa-user"></i>
                        <span>Tài khoản</span>
                    </a>
                </div>
                <div class="button shoppingCart">
                    <a href="" class="bt gio">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Giỏ hàng</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div id="page-footer">
        <div class="container"></div>
    </div>
</div>
</body>
</html>
