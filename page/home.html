<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/home.css">
</head>
<body>
<div id="home-page">
    <div id="page-header">
        <div class="container">
            <div class="header-message"></div>
            <div class="header-title">
                <a href="" class="logo">
                    <img src="/assets/img/logo/logoChinh.png" alt="Sách thiếu nhi cho bé">
                </a>
            </div>
            <div class="header-menu">
                <div class="button trangChu">
                    <a href=""><i class="fa-solid fa-house"></i><span>Trang chủ</span></a>
                </div>
                <div class="button category">
                    <a href="" class="danh muc">
                        <i class="fa-solid fa-list"></i><span>Danh mục</span></a>
                </div>
                <div class="button search">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" placeholder="Tìm kiếm sách">
                </div>
                <div class="button user">
                    <a href="" class="taikhoan">
                        <i class="fa-solid fa-user"></i>
                        <span>Tài khoản</span>
                    </a>
                </div>
                <div class="button shoppingCart">
                    <a href="" class="gio">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span>Giỏ hàng</span>
                    </a>
                </div>
            </div>
        </div>
    </div>
    <div id="page-footer">
        <div class="container"></div>
    </div>
</div>
</body>
</html>
